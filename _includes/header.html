<header class="site-header">
  <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="{{ site.title }}">
    <svg class="site-logo__mark" viewBox="0 0 160 160" aria-hidden="true">
      <defs>
        <path id="logo-circle" d="M 31.5 108 A 56 56 0 1 1 128.5 52 A 56 56 0 1 1 31.5 108" />
      </defs>
      <text>
        <textPath href="#logo-circle">Hållbarhetsarkitekten.</textPath>
      </text>
    </svg>
  </a>
</header>

<script>
  // Spin one full turn per hover, and always finish the turn
  const logo = document.querySelector('.site-logo');
  if (logo) {
    logo.addEventListener('mouseenter', () => logo.classList.add('site-logo--spin'));
    logo.addEventListener('animationend', () => logo.classList.remove('site-logo--spin'));
  }
</script>
